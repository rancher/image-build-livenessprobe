---
name: "Update livenessprobe version"

sources:
  vsphere-csi-driver:
    name: Get latest vsphere-csi-driver version
    kind: githubrelease
    spec:
      owner: kubernetes-sigs
      repository: vsphere-csi-driver
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        release: true
        draft: false
        prerelease: false
      versionfilter:
        kind: semver

  livenessprobe:
    name: Get livenessprobe version from vsphere-csi-driver manifest
    kind: file
    spec:
      file: 'https://raw.githubusercontent.com/kubernetes-sigs/vsphere-csi-driver/{{ source "vsphere-csi-driver" }}/manifests/vanilla/vsphere-csi-driver.yaml'
      matchpattern: 'registry\.k8s\.io/sig-storage/livenessprobe:(v[0-9]+\.[0-9]+\.[0-9]+)'
      replacepattern: '$1'

targets:
  tagfile:
    name: "Bump to livenessprobe version used by vsphere-csi-driver in TAG"
    kind: file
    sourceid: livenessprobe
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'
      replacepattern: '{{ source "livenessprobe" }}'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ .github.username }}'
      user: '{{ .github.username }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'

actions:
  default:
    title: 'Bump livenessprobe version to {{ source "livenessprobe" }}'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      labels:
        - updatecli
    scmid: default
